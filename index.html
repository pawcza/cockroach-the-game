    /* loading-art:end */
    #load-overlay {
      --s: 2; --ts: 2; --tw: 1440px; --lt: 400px;
      position: fixed; inset: 0; z-index: 9990; overflow: hidden;
      background: #04050a;
      font-family: 'Tiny5', monospace;
      color: #f1e3c6;
      transition: opacity .45s ease-out;
    }
    #load-overlay.reduced { transition-duration: .15s; }
    #load-overlay .ld-layer { position: absolute; inset: 0; overflow: hidden; }
    #load-overlay .ld-layer i {
      position: absolute; left: 0; top: 0; height: 100%; width: calc(100% + var(--tw));
      background-repeat: repeat-x; background-size: var(--tw) 100%;
      will-change: transform;
    }
    #load-overlay .ld-far i { background-image: var(--ld-far); }
    #load-overlay .ld-mid i { background-image: var(--ld-mid); }
    #load-overlay .ld-near i { background-image: var(--ld-near); }
    /* The menu dims the same plates the same way: darker toward the top and bottom edges */
    #load-overlay .ld-shade {
      position: absolute; inset: 0;
      background:
        linear-gradient(to bottom, rgba(7,5,10,.8) 0%, rgba(7,5,10,.5) 28%, rgba(7,5,10,.45) 55%, rgba(7,5,10,.85) 100%);
    }
    #load-overlay .ld-pit {
      position: absolute; left: 0; right: 0; top: var(--lt); bottom: 0;
      background: linear-gradient(to bottom, rgba(4,5,10,0) 0, rgba(4,5,10,.9) calc(var(--s) * 22px), rgba(4,5,10,.9) 100%);
    }
    #load-overlay .ld-cap {
      position: absolute; left: 0; right: 0; top: 9%;
      text-align: center; white-space: nowrap;
      font-size: calc(var(--ts) * 8px); line-height: 1; letter-spacing: calc(var(--ts) * 1px);
      color: #e0a040; text-shadow: 0 calc(var(--ts) * 1px) 0 #000, 0 0 calc(var(--ts) * 6px) rgba(0,0,0,.9);
    }
    #load-overlay .ld-cap b { font-weight: 400; color: #8a7d6b; margin-left: calc(var(--ts) * 8px); display: inline-block; min-width: calc(var(--ts) * 24px); text-align: left; }
    #load-overlay .ld-dots::after { content: ''; display: inline-block; width: calc(var(--ts) * 18px); text-align: left; animation: ld-dots 1.2s steps(1) infinite; }
    #load-overlay.reduced .ld-dots::after { content: '...'; animation: none; }
    @keyframes ld-dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

    #load-overlay .ld-boss {
      position: absolute; opacity: 0; transform: translateY(calc(var(--s) * 8px));
      transition: opacity .6s ease-out, transform .6s ease-out;
      filter: drop-shadow(0 0 calc(var(--s) * 2px) rgba(var(--rgb), .4));
    }
    #load-overlay .ld-boss.on { opacity: 1; transform: none; }
    #load-overlay .ld-boss u {
      display: block; width: 100%; height: 100%; background: #0c0912;
      -webkit-mask: var(--m) center / 100% 100% no-repeat; mask: var(--m) center / 100% 100% no-repeat;
    }
    #load-overlay .b1 { --m: var(--ld-boss1); --ac: #d9578f; --rgb: 217,87,143; }
    #load-overlay .b2 { --m: var(--ld-boss2); --ac: #9b5cff; --rgb: 155,92,255; }
    #load-overlay .b3 { --m: var(--ld-boss3); --ac: #2fb9a0; --rgb: 47,185,160; }
    #load-overlay .b4 { --m: var(--ld-boss4); --ac: #d8d03a; --rgb: 216,208,58; }
    #load-overlay.flash .ld-boss u { animation: ld-flash .8s ease-out both; animation-delay: calc(var(--i) * 110ms); }
    #load-overlay.flash .ld-boss { animation: ld-glow .8s ease-out both; animation-delay: calc(var(--i) * 110ms); }
    @keyframes ld-flash { 0% { background: #0c0912; } 22% { background: var(--ac); } 100% { background: #0c0912; } }
    @keyframes ld-glow { 0% { filter: drop-shadow(0 0 calc(var(--s) * 2px) rgba(var(--rgb), .4)); } 22% { filter: drop-shadow(0 0 calc(var(--s) * 9px) rgba(var(--rgb), .95)); } 100% { filter: drop-shadow(0 0 calc(var(--s) * 2px) rgba(var(--rgb), .4)); } }

    #load-overlay .ld-ledge {
      position: absolute; left: 0; right: 0; top: var(--lt); height: calc(var(--s) * 27px); overflow: hidden;
    }
    #load-overlay .ld-ledge i {
      position: absolute; left: 0; top: 0; height: 100%; width: calc(100% + var(--s) * 340px);
      background: var(--ld-ledge) 0 0 / calc(var(--s) * 340px) 100% repeat-x;
      image-rendering: pixelated; will-change: transform;
    }
    /* What is still ahead of the roach is dark; behind it, the ledge is lit */
    #load-overlay .ld-ahead { position: absolute; top: 0; bottom: 0; right: 0; left: 0; background: rgba(4,5,10,.66); }
    #load-overlay .ld-trail {
      position: absolute; left: 0; top: 0; height: calc(var(--s) * 1px); width: 0;
      background: #ffd27a; box-shadow: 0 0 calc(var(--s) * 4px) rgba(255,190,90,.8);
    }
    #load-overlay .ld-roach {
      position: absolute; left: 0; top: calc(var(--lt) - var(--s) * 46px);
      width: calc(var(--s) * 88px); height: calc(var(--s) * 55px);
      background: var(--ld-roach) 0 0 / calc(var(--s) * 704px) calc(var(--s) * 55px) no-repeat;
      image-rendering: pixelated; will-change: transform;
      animation: ld-legs .5s steps(8) infinite;
    }
    #load-overlay.reduced .ld-roach { animation: none; }
    @keyframes ld-legs { to { background-position-x: calc(var(--s) * -704px); } }
    #load-overlay .ld-shadow {
      position: absolute; left: 0; top: calc(var(--lt) + var(--s) * 1px);
      width: calc(var(--s) * 70px); height: calc(var(--s) * 4px); margin-left: calc(var(--s) * 10px);
      background: radial-gradient(closest-side, rgba(0,0,0,.65), rgba(0,0,0,0)); will-change: transform;
    }
    #load-overlay .ld-tip {
      position: absolute; left: 0; right: 0; top: calc(var(--lt) + var(--s) * 38px);
      padding: 0 calc(var(--s) * 12px); text-align: center;
      font-size: calc(var(--ts) * 10px); line-height: 1.5; color: #f1e3c6;
      text-shadow: 0 calc(var(--ts) * 1px) 0 #000;
    }
    #load-overlay .ld-tip span { display: inline-block; transition: opacity .25s; }
    #load-overlay .ld-tip span.out { opacity: 0; }
    #load-overlay.reduced .ld-tip span { transition: none; }

    * { margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Portrait orientation overlay - mobile only, dismissed by tap */
    #portrait-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: 'Tiny5', monospace;
      cursor: pointer;
    }

    /* Show on mobile until dismissed by JS */
    @media (hover: none) and (pointer: coarse) {
      #portrait-overlay:not(.dismissed) { display: flex; }
    }

    #portrait-overlay .cockroach-anim {
      width: 176px;
      height: 110px;
      background: var(--ld-roach) 0 0 / 800% 100%;
      image-rendering: pixelated;
      position: absolute;
      top: 20%;
      animation: roach-run-across 3s linear infinite, roach-legs .5s steps(8) infinite;
    }

    @keyframes roach-legs { to { background-position-x: 800%; } }
    @keyframes roach-run-across {
      0% { left: -160px; }
      100% { left: 100%; }
    }


    #portrait-overlay .message {
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      line-height: 1.8;
      padding: 0 30px;
    }

    #portrait-overlay .tap-message {
      display: none;
      color: #ffff00;
      font-size: 16px;
      text-align: center;
      animation: tap-pulse 1s ease-in-out infinite alternate;
    }

    @keyframes tap-pulse {
      from { opacity: 0.5; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* In landscape: hide rotate hint, show tap prompt */
    @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
      #portrait-overlay .message { display: none; }
      #portrait-overlay .phone-hint { display: none; }
      #portrait-overlay .tap-message { display: block; }
    }

    #portrait-overlay .phone-hint {
      position: relative;
      width: 60px;
      height: 100px;
      animation: phone-cycle 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-rect {
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      border-radius: 8px;
      transform-origin: center center;
      animation: phone-flip 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-arrow {
      position: absolute;
      top: -28px;
      right: -20px;
      font-size: 28px;
      color: #fff;
      animation: arrow-fade 3.5s ease-in-out infinite;
    }

    @keyframes phone-flip {
      0% { transform: rotate(0deg); opacity: 1; }
      15% { transform: rotate(0deg); opacity: 1; }
      45% { transform: rotate(90deg); opacity: 1; }
      65% { transform: rotate(90deg); opacity: 1; }
      80% { transform: rotate(90deg); opacity: 0; }
      81% { transform: rotate(0deg); opacity: 0; }
      100% { transform: rotate(0deg); opacity: 1; }
    }

    @keyframes arrow-fade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      40% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes phone-cycle {
      0% { opacity: 1; }
      80% { opacity: 1; }
      81% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="load-overlay" role="progressbar" aria-label="Ładowanie gry" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="ld-layer ld-far"><i></i></div>
    <div class="ld-layer ld-mid"><i></i></div>
    <div class="ld-layer ld-near"><i></i></div>
    <div class="ld-shade"></div>
    <div class="ld-pit"></div>
    <div class="ld-cap"><span class="ld-dots">ładowanko</span><b class="ld-pct">0%</b></div>
    <div class="ld-boss b1" style="--i:0"><u></u></div>
    <div class="ld-boss b2" style="--i:1"><u></u></div>
    <div class="ld-boss b3" style="--i:2"><u></u></div>
    <div class="ld-boss b4" style="--i:3"><u></u></div>
    <div class="ld-ledge"><i></i><div class="ld-ahead"></div><div class="ld-trail"></div></div>
    <div class="ld-shadow"></div>
    <div class="ld-roach"></div>
    <div class="ld-tip"><span></span></div>
  </div>
  <div id="portrait-overlay">
    <div class="cockroach-anim"></div>
    <div class="message">Karaluch zaleca<br>trzymać telefon<br>poziomo</div>
    <div class="phone-hint">
      <div class="phone-rect"></div>
      <div class="phone-arrow">↷</div>
    </div>
    <div class="tap-message">Dotknij aby grać</div>
  </div>
  <script>
    (function() {
      var overlay = document.getElementById('portrait-overlay');
      function dismissOverlay() {
        overlay.classList.add('dismissed');
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function() {});
        }
      }
      overlay.addEventListener('click', dismissOverlay);
      overlay.addEventListener('touchend', function(e) {
        e.preventDefault();
        dismissOverlay();
      });
    })();
  </script>
  <script>
    /* The loading screen's driver. The game talks to it through window.__loading:
         progress(0..1)  the loader's real progress; the roach only ever moves forward
         finish()        the load is done: the roach runs the rest of the way, the bosses flash; returns a promise
         reveal()        the menu has drawn its first frame: fade out over it and go
       Until the first progress() arrives the game is still downloading, so the roach runs on the spot. */
    (function() {
      var root = document.getElementById('load-overlay');
      if (!root) return;
      var q = function(sel) { return root.querySelector(sel); };
      var reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
      var touch = !!(window.matchMedia && matchMedia('(hover: none) and (pointer: coarse)').matches);
      if (reduced) root.classList.add('reduced');

      var layers = [
        { el: q('.ld-far i'), rate: 0.1 },
        { el: q('.ld-mid i'), rate: 0.4 },
        { el: q('.ld-near i'), rate: 1 }
      ];
      var ledge = q('.ld-ledge i'), ahead = q('.ld-ahead'), trail = q('.ld-trail');
      var roach = q('.ld-roach'), shadow = q('.ld-shadow');
      var pct = q('.ld-pct'), tipEl = q('.ld-tip span');
      var bosses = [].slice.call(root.querySelectorAll('.ld-boss'));
      var css = getComputedStyle(root);
      var ratio = bosses.map(function(_, i) { return parseFloat(css.getPropertyValue('--ld-boss' + (i + 1) + '-ar')) || 1; });

      // One line each, true today. [keyboard, touch]; a single string serves both
      var TIPS = [
        ['↑ ↓ — zmiana toru', 'Lewa strona ekranu — zmiana toru'],
        'Dash i pistolet zdobywasz na bossach',
        'Dash przebija przeszkody. PRZEBICIE! to punkty',
        'Pani Lodzia nie lubi karaluchów',
        'Zmień tor w ostatniej chwili, a będzie NA STYK!',
        'Wylinka od Zlewiatana: jedno trafienie ci wybaczy',
        'Pigułka: pięć sekund turbo',
        'Cebulę omijaj, jabłka zbieraj',
        'Eksterminator: bez faktury taniej',
        'DJ Bigos, król remizy, ma dla ciebie pistolet',
        'Karaluch Dnia: ten sam bieg dla wszystkich',
        ['ESC — pauza', 'II w rogu — pauza']
      ];

      var W = 0, H = 0, s = 2, lt = 0, x0 = 0, x1 = 0, rw = 0;
      var target = 0, shown = 0, started = false, finishing = false, flashed = false, gone = false;
      var offset = 0, last = 0, raf = 0, tipTimer = 0, shownPct = -1, revealed = 0;
      var done = null;
      var finished = new Promise(function(res) { done = res; });

      function layout() {
        W = window.innerWidth; H = window.innerHeight;
        s = Math.max(1, Math.min(4, Math.round(H / 340), Math.floor(W / 260)));
        lt = Math.round(H * 0.68 / s) * s;
        rw = 88 * s;
        root.style.setProperty('--s', s);
        root.style.setProperty('--ts', s < 2 ? 1.5 : s); // small type stays readable on a phone
        root.style.setProperty('--lt', lt + 'px');
        root.style.setProperty('--tw', Math.round(H * 2) + 'px');

        // The bosses stand along the far end, the last of them furthest back and tallest; each rises from behind the ledge
        var scale = [0.9, 1, 0.94, 1.08], overlap = 0.08, unit = 0;
        for (var i = 0; i < 4; i++) unit += ratio[i] * scale[i] * (1 - (i < 3 ? overlap : 0));
        var bh = Math.min(H * 0.3, (W * 0.46) / unit);
        var edge = W - Math.max(8 * s, W * 0.03), left = edge;
        for (var j = 3; j >= 0; j--) {
          var h = Math.round(bh * scale[j]), w = Math.round(h * ratio[j]);
          left = edge - w;
          var st = bosses[j].style;
          st.width = w + 'px'; st.height = h + 'px'; st.left = left + 'px';
          st.top = (lt + 6 * s - h) + 'px';
          st.zIndex = String(4 - j);
          edge = left + Math.round(w * overlap);
        }
        // the roach stops just short of the first boss
        x0 = Math.max(6 * s, W * 0.035);
        x1 = Math.max(x0 + W * 0.2, left - rw - 4 * s);
        paint();
      }

      function paint() {
        var x = Math.round((x0 + (x1 - x0) * shown) / s) * s;
        roach.style.transform = 'translate3d(' + x + 'px,0,0)';
        shadow.style.transform = 'translate3d(' + x + 'px,0,0)';
        var mid = x + 46 * s;
        ahead.style.left = mid + 'px';
        trail.style.width = mid + 'px';
        var tw = H * 2, tile = 340 * s;
        ledge.style.transform = 'translate3d(' + (-Math.round((offset % tile) / s) * s) + 'px,0,0)';
        for (var i = 0; i < layers.length; i++) {
          var o = (offset * layers[i].rate + shown * W * layers[i].rate * 0.5) % tw;
          layers[i].el.style.transform = 'translate3d(' + (-o).toFixed(1) + 'px,0,0)';
        }
        var p = Math.round(shown * 100);
        if (p !== shownPct) {
          shownPct = p;
          pct.textContent = p + '%';
          root.setAttribute('aria-valuenow', String(p));
        }
        while (revealed < 4 && shown >= (revealed + 1) / 4 - 0.004) bosses[revealed++].classList.add('on');
      }

      function tick(now) {
        raf = requestAnimationFrame(tick);
        var dt = Math.min(0.1, (now - (last || now)) / 1000);
        last = now;
        if (!reduced) offset += dt * 64 * s;
        var gap = target - shown;
        if (reduced || gap < 0.0005) shown = target;
        else shown += gap * (1 - Math.exp(-dt / (finishing ? 0.1 : 0.25)));
        paint();
        if (finishing && !flashed && shown >= 0.996) {
          flashed = true;
          shown = 1;
          paint();
          if (!reduced) root.classList.add('flash');
          setTimeout(done, reduced ? 0 : 520);
        }
      }

      function nextTip() {
        var tip = TIPS[Math.floor(Math.random() * TIPS.length)];
        if (typeof tip !== 'string') tip = tip[touch ? 1 : 0];
        if (tip === tipEl.textContent) return nextTip();
        tipEl.textContent = tip;
      }
      function rotateTips() {
        tipEl.classList.add('out');
        setTimeout(function() { nextTip(); tipEl.classList.remove('out'); }, reduced ? 0 : 260);
      }

      function remove() {
        if (!root.parentNode) return;
        cancelAnimationFrame(raf);
        clearInterval(tipTimer);
        window.removeEventListener('resize', layout);
        root.remove();
        window.__loading = undefined;
      }

      window.__loading = {
        progress: function(p) { started = true; target = Math.max(target, Math.min(1, +p || 0)); },
        finish: function() { finishing = true; target = 1; return finished; },
        reveal: function() {
          if (gone) return;
          gone = true;
          root.style.pointerEvents = 'none';
          root.style.opacity = '0';
          root.addEventListener('transitionend', function(e) { if (e.target === root) remove(); });
          setTimeout(remove, 800);
        }
      };

      nextTip();
      tipTimer = setInterval(rotateTips, 3600);
      window.addEventListener('resize', layout);
      layout();
      raf = requestAnimationFrame(tick);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
