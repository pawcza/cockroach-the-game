<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Karaluch</title>
  <!-- Hosted with the game rather than from Google Fonts, so a visit tells nobody else anything -->
  <link rel="preload" href="/fonts/tiny5-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/tiny5-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪳</text></svg>">
  <style>
    @font-face {
      font-family: 'Tiny5';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/tiny5-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Tiny5';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url(/fonts/tiny5-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    * { margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Portrait orientation overlay - mobile only, dismissed by tap */
    #portrait-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: 'Tiny5', monospace;
      cursor: pointer;
    }

    /* Show on mobile until dismissed by JS */
    @media (hover: none) and (pointer: coarse) {
      #portrait-overlay:not(.dismissed) { display: flex; }
    }

    #portrait-overlay .cockroach-anim {
      width: 176px;
      height: 110px;
      background: url('/assets/roach-run.png') 0 0 / 800% 100%;
      image-rendering: pixelated;
      position: absolute;
      top: 20%;
      animation: roach-run-across 3s linear infinite, roach-legs .5s steps(8) infinite;
    }

    @keyframes roach-legs { to { background-position-x: 800%; } }
    @keyframes roach-run-across {
      0% { left: -160px; }
      100% { left: 100%; }
    }


    #portrait-overlay .message {
      color: #ffffff;
      font-size: 16px;
      text-align: center;
      line-height: 1.8;
      padding: 0 30px;
    }

    #portrait-overlay .tap-message {
      display: none;
      color: #ffff00;
      font-size: 16px;
      text-align: center;
      animation: tap-pulse 1s ease-in-out infinite alternate;
    }

    @keyframes tap-pulse {
      from { opacity: 0.5; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* In landscape: hide rotate hint, show tap prompt */
    @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
      #portrait-overlay .message { display: none; }
      #portrait-overlay .phone-hint { display: none; }
      #portrait-overlay .tap-message { display: block; }
    }

    #portrait-overlay .phone-hint {
      position: relative;
      width: 60px;
      height: 100px;
      animation: phone-cycle 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-rect {
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      border-radius: 8px;
      transform-origin: center center;
      animation: phone-flip 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-arrow {
      position: absolute;
      top: -28px;
      right: -20px;
      font-size: 28px;
      color: #fff;
      animation: arrow-fade 3.5s ease-in-out infinite;
    }

    @keyframes phone-flip {
      0% { transform: rotate(0deg); opacity: 1; }
      15% { transform: rotate(0deg); opacity: 1; }
      45% { transform: rotate(90deg); opacity: 1; }
      65% { transform: rotate(90deg); opacity: 1; }
      80% { transform: rotate(90deg); opacity: 0; }
      81% { transform: rotate(0deg); opacity: 0; }
      100% { transform: rotate(0deg); opacity: 1; }
    }

    @keyframes arrow-fade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      40% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes phone-cycle {
      0% { opacity: 1; }
      80% { opacity: 1; }
      81% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="portrait-overlay">
    <div class="cockroach-anim"></div>
    <div class="message">Karaluch zaleca<br>trzymać telefon<br>poziomo</div>
    <div class="phone-hint">
      <div class="phone-rect"></div>
      <div class="phone-arrow">↷</div>
    </div>
    <div class="tap-message">Dotknij aby grać</div>
  </div>
  <script>
    (function() {
      var overlay = document.getElementById('portrait-overlay');
      function dismissOverlay() {
        overlay.classList.add('dismissed');
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function() {});
        }
      }
      overlay.addEventListener('click', dismissOverlay);
      overlay.addEventListener('touchend', function(e) {
        e.preventDefault();
        dismissOverlay();
      });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
