<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Karaluch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪳</text></svg>">
  <style>
    * { margin: 0; padding: 0; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Portrait orientation overlay - mobile only, dismissed by tap */
    #portrait-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: 'Press Start 2P', monospace;
      cursor: pointer;
    }

    /* Show on mobile until dismissed by JS */
    @media (hover: none) and (pointer: coarse) {
      #portrait-overlay:not(.dismissed) { display: flex; }
    }

    #portrait-overlay .cockroach-anim {
      width: 160px;
      height: 80px;
      image-rendering: pixelated;
      position: absolute;
      top: 20%;
      animation: roach-run-across 3s linear infinite;
    }

    @keyframes roach-run-across {
      0% { left: -160px; }
      100% { left: 100%; }
    }


    #portrait-overlay .message {
      color: #ffffff;
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
      padding: 0 30px;
    }

    #portrait-overlay .tap-message {
      display: none;
      color: #ffff00;
      font-size: 14px;
      text-align: center;
      animation: tap-pulse 1s ease-in-out infinite alternate;
    }

    @keyframes tap-pulse {
      from { opacity: 0.5; transform: scale(1); }
      to { opacity: 1; transform: scale(1.05); }
    }

    /* In landscape: hide rotate hint, show tap prompt */
    @media (orientation: landscape) and (hover: none) and (pointer: coarse) {
      #portrait-overlay .message { display: none; }
      #portrait-overlay .phone-hint { display: none; }
      #portrait-overlay .tap-message { display: block; }
    }

    #portrait-overlay .phone-hint {
      position: relative;
      width: 60px;
      height: 100px;
      animation: phone-cycle 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-rect {
      position: absolute;
      inset: 0;
      border: 3px solid #fff;
      border-radius: 8px;
      transform-origin: center center;
      animation: phone-flip 3.5s ease-in-out infinite;
    }

    #portrait-overlay .phone-arrow {
      position: absolute;
      top: -28px;
      right: -20px;
      font-size: 28px;
      color: #fff;
      animation: arrow-fade 3.5s ease-in-out infinite;
    }

    @keyframes phone-flip {
      0% { transform: rotate(0deg); opacity: 1; }
      15% { transform: rotate(0deg); opacity: 1; }
      45% { transform: rotate(90deg); opacity: 1; }
      65% { transform: rotate(90deg); opacity: 1; }
      80% { transform: rotate(90deg); opacity: 0; }
      81% { transform: rotate(0deg); opacity: 0; }
      100% { transform: rotate(0deg); opacity: 1; }
    }

    @keyframes arrow-fade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      40% { opacity: 1; }
      50% { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes phone-cycle {
      0% { opacity: 1; }
      80% { opacity: 1; }
      81% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="portrait-overlay">
    <img class="cockroach-anim" src="/assets/cockroach-idle.png" alt="">
    <div class="message">Karaluch zaleca<br>trzymać telefon<br>poziomo</div>
    <div class="phone-hint">
      <div class="phone-rect"></div>
      <div class="phone-arrow">↷</div>
    </div>
    <div class="tap-message">Dotknij aby grać</div>
  </div>
  <script>
    (function() {
      var img = document.querySelector('#portrait-overlay .cockroach-anim');
      var frames = ['/assets/cockroach-idle.png', '/assets/cockroach-running.png'];
      var f = 0;
      setInterval(function() { f = 1 - f; img.src = frames[f]; }, 200);

      var overlay = document.getElementById('portrait-overlay');
      function dismissOverlay() {
        overlay.classList.add('dismissed');
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(function() {});
        }
      }
      overlay.addEventListener('click', dismissOverlay);
      overlay.addEventListener('touchend', function(e) {
        e.preventDefault();
        dismissOverlay();
      });
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
